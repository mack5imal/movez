name: movez

options:
  bundleIdPrefix: com.kylemack
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5"
    SWIFT_STRICT_CONCURRENCY: targeted
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    ALWAYS_SEARCH_USER_PATHS: NO

targets:
  movez:
    type: application
    platform: macOS
    sources:
      - path: Sources/movez
        excludes:
          - "Resources/Info.plist"
          - "Resources/Fonts"
          - "Resources/Chimes"
          - "movez.entitlements"
      - path: Sources/movez/Resources/Fonts
        type: folder
        buildPhase: resources
      - path: Sources/movez/Resources/Chimes
        type: folder
        buildPhase: resources
      - path: movement-library-v4.json
        buildPhase: resources
      - path: HEALTH_AND_SAFETY.md
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Sources/movez/Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        # The app version lives here and nowhere else; `make version V=x.y.z` changes it. The
        # build number is overwritten on every build with the commit count (see below).
        MARKETING_VERSION: 0.5.0
        CURRENT_PROJECT_VERSION: 1
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.kylemack.movez
        PRODUCT_NAME: movez
        CODE_SIGN_ENTITLEMENTS: Sources/movez/movez.entitlements
        COMBINE_HIDPI_IMAGES: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    postBuildScripts:
      # Every commit gets a higher build number without anyone remembering to bump it. It runs
      # before the implicit code-sign step, so the signature covers the edited Info.plist.
      - name: Stamp build number
        basedOnDependencyAnalysis: false
        # Declaring the processed Info.plist as an input is what orders this after Xcode writes
        # it; without it the plist could be processed afterwards and reset the number to 1.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          plist="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          if count=$(git -C "${SRCROOT}" rev-list --count HEAD 2>/dev/null); then
            /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${count}" "${plist}"
          fi

  movezTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/movezTests
    dependencies:
      - target: movez
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kylemack.movezTests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5"

schemes:
  movez:
    build:
      targets:
        movez: all
        movezTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - movezTests
